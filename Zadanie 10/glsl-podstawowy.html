<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Sinus Shader 2D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
          }
        }</script>
    <script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────────────────────────
// VERTEX SHADER
// ─────────────────────────────────────────────────────────────────
const vertexShader = /* glsl */`
  varying vec2 vUv;

  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

// ─────────────────────────────────────────────────────────────────
// FRAGMENT SHADER
// ─────────────────────────────────────────────────────────────────
const fragmentShader = /* glsl */`
  precision highp float;

  varying vec2 vUv;
  uniform float u_time;
  uniform vec2 u_resolution;

  void main() {
    // Parametry fali
    float czestotliwosc = 8.0;
    float predkosc = 3.0;
    float gruboscFali = 0.02; 

    // 1. Obliczenie wartości funkcji sinus 
    float wartoscSinusa = sin(vUv.x * czestotliwosc - u_time * predkosc);

    // 2. Mapowanie wartości sinusa na pozycję Y (0.0 do 1.0)
    float pozycjaYFali = 0.5 + 0.25 * wartoscSinusa;

    // 3. Tworzenie maski fali (gładkie krawędzie)
    float maskaFali = 1.0 - smoothstep(gruboscFali, gruboscFali + 0.01, abs(vUv.y - pozycjaYFali));

    // 4. Mapowanie koloru w zależności od wysokości fali
    float t = (wartoscSinusa - (-1.0)) / (1.0 - (-1.0));

    vec3 kolorZolty = vec3(1.0, 1.0, 0.0);
    vec3 kolorCzerwony = vec3(1.0, 0.0, 0.0);

    vec3 kolorFali = mix(kolorZolty, kolorCzerwony, t);

    // 5. Miksowanie z tłem
    vec3 kolorTla = vec3(0.05, 0.05, 0.1);
    vec3 koncowyKolor = mix(kolorTla, kolorFali, maskaFali);

    gl_FragColor = vec4(koncowyKolor, 1.0);
  }
`;

// ─────────────────────────────────────────────────────────────────
// Three.js setup
// ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const uniforms = {
  u_time: { value: 0.0 },
  u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const mesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms })
);
scene.add(mesh);

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function tick() {
  uniforms.u_time.value = clock.getElapsedTime();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
    </script>
</body>
</html>
