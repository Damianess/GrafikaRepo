<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
    <title>CS424, Fall 2017, Lab 12 - Photorealistic Windmill</title>
    <style>
        body {
            background-color: #111111;
            color: #EEEEEE;
            font-family: sans-serif;
        }

        label {
            white-space: pre;
            margin-left: 25px;
        }

        h2 {
            color: #FFFFFF;
        }
    </style>

    <script type="x-shader/x-vertex" id="vshader-source">
        attribute vec3 a_coords;
        attribute vec3 a_normal;
        uniform mat4 modelview;
        uniform mat4 projection;
        varying vec3 v_normal;
        varying vec3 v_eyeCoords;
        void main() {
            vec4 coords = vec4(a_coords,1.0);
            vec4 eyeCoords = modelview * coords;
            gl_Position = projection * eyeCoords;
            v_normal = normalize(a_normal);
            v_eyeCoords = eyeCoords.xyz/eyeCoords.w;
        }
    </script>

    <script type="x-shader/x-fragment" id="fshader-source">
        #ifdef GL_FRAGMENT_PRECISION_HIGH
           precision highp float;
        #else
           precision mediump float;
        #endif
        struct MaterialProperties {
            vec3 diffuseColor;
            vec3 specularColor;
            vec3 emissiveColor;
            float specularExponent;
        };
        struct LightProperties {
            bool enabled;
            vec4 position;
            vec3 color;
        };
        uniform MaterialProperties material;
        uniform LightProperties lights[4];
        uniform mat3 normalMatrix;
        varying vec3 v_normal;
        varying vec3 v_eyeCoords;
        vec3 lightingEquation( LightProperties light, MaterialProperties material,
                                    vec3 eyeCoords, vec3 N, vec3 V ) {
            vec3 L, R;
            if ( light.position.w == 0.0 ) {
                L = normalize( light.position.xyz );
            }
            else {
                L = normalize( light.position.xyz/light.position.w - v_eyeCoords );
            }
            if (dot(L,N) <= 0.0) {
                return vec3(0.0);
            }
            vec3 reflection = dot(L,N) * light.color * material.diffuseColor;
            R = -reflect(L,N);
            if (dot(R,V) > 0.0) {
                float factor = pow(dot(R,V),material.specularExponent);
                reflection += factor * material.specularColor * light.color;
            }
            return reflection;
        }
        void main() {
            vec3 normal = normalize( normalMatrix*v_normal );
            vec3 viewDirection = normalize( -v_eyeCoords);
            vec3 color = material.emissiveColor;
            for (int i = 0; i < 4; i++) {
                if (lights[i].enabled) {
                    if (gl_FrontFacing) {
                        color += lightingEquation( lights[i], material, v_eyeCoords,
                                                        normal, viewDirection);
                    }
                    else {
                        color += lightingEquation( lights[i], material, v_eyeCoords,
                                                        -normal, viewDirection);
                    }
                }
            }
            gl_FragColor = vec4(color, 1);
        }
    </script>

    <script src="resources/gl-matrix.js"></script>
    <script src="resources/basic-object-models-IFS.js"></script>
    <script src="teapot-model-IFS.js"></script>
    <script>

"use strict";

var gl;
var canvas;

var a_coords_loc;
var a_normal_loc;

var u_modelview;
var u_projection;
var u_normalMatrix;

var u_material;
var u_lights;

var projection = mat4.create();
var modelview = mat4.create();
var normalMatrix = mat3.create();

var frameNumber = 0;

var cone, cylinder, cube, teapot, sphere;

var matrixStack = [];

var currentColor = [1,1,1];

var rotateX = 0, rotateY = 0;
function draw() {
    gl.clearColor(0.05, 0.05, 0.05, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    mat4.perspective(projection, Math.PI/4, 1, 1, 50);
    gl.uniformMatrix4fv(u_projection, false, projection );

    mat4.lookAt(modelview, [0, 5, 20], [0, 4.5, 0], [0, 1, 0]);

    mat4.rotateX(modelview, modelview, rotateX);
    mat4.rotateY(modelview, modelview, rotateY);
    pushMatrix();
        mat4.translate(modelview, modelview, [0, -0.2, 0]);
        mat4.scale(modelview, modelview, [10, 1.4, 10]);
        currentColor = [0.28, 0.11, 0.08];
        gl.uniform3f(u_material.specularColor, 0.1, 0.1, 0.1);
        gl.uniform1f(u_material.specularExponent, 10);
        cube.render();
    popMatrix();
    pushMatrix();
        mat4.translate(modelview, modelview, [0, 0.5, 0]);
        mat4.rotateX(modelview, modelview, Math.PI/2);
        mat4.scale(modelview, modelview, [1.1, 1.1, 0.1]);
        currentColor = [0.75, 0.75, 0.75]; 
        gl.uniform3f(u_material.specularColor, 0.8, 0.8, 0.8);
        gl.uniform1f(u_material.specularExponent, 64);
        cylinder.render();
    popMatrix();
    pushMatrix();
        mat4.translate(modelview, modelview, [0, 4.5, 0]);
        mat4.rotateX(modelview, modelview, Math.PI/2); 
        mat4.scale(modelview, modelview, [0.4, 0.4, 8]); 
        currentColor = [0.78, 0.61, 0.23]; 
        gl.uniform3f(u_material.specularColor, 0.5, 0.4, 0.2);
        gl.uniform1f(u_material.specularExponent, 30);
        cylinder.render();
    popMatrix();
    pushMatrix();
        mat4.translate(modelview, modelview, [0, 8.5, 0.5]);
        mat4.scale(modelview, modelview, [0.6, 0.6, 0.6]);
        currentColor = [0.8, 0.8, 0.85]; 
        gl.uniform3f(u_material.specularColor, 0.9, 0.9, 0.9);
        gl.uniform1f(u_material.specularExponent, 128);
        if(typeof sphere !== 'undefined') { sphere.render(); } else { cube.render(); }
    popMatrix();
    pushMatrix();
        mat4.translate(modelview, modelview, [0, 8.5, 0.6]);
        mat4.rotateZ(modelview, modelview, frameNumber / 50); 

        for (var i = 0; i < 3; i++) {
            pushMatrix();
                mat4.rotateZ(modelview, modelview, i * (2 * Math.PI / 3));
                mat4.rotateX(modelview, modelview, -Math.PI / 2);

                gl.uniform3f(u_material.specularColor, 0.9, 0.9, 1.0);
                gl.uniform1f(u_material.specularExponent, 80);
                pushMatrix();
                    mat4.translate(modelview, modelview, [0, 0, 1.8]);
                    mat4.scale(modelview, modelview, [0.5, 0.25, 3.6]);
                    currentColor = [0.75, 0.88, 0.93]; 
                    cone.render();
                popMatrix();
                pushMatrix();
                    mat4.translate(modelview, modelview, [0, 0, 1.8]);
                    mat4.rotateY(modelview, modelview, Math.PI);
                    mat4.scale(modelview, modelview, [0.5, 0.25, 1.8]);
                    currentColor = [0.83, 0.92, 0.95]; 
                    cone.render();
                popMatrix();
            popMatrix();
        }
    popMatrix();
    if (teapot) {
        pushMatrix();
            mat4.translate(modelview, modelview, [2.8, 0.9, 2.5]); 
            mat4.rotateY(modelview, modelview, -Math.PI / 6);
            mat4.scale(modelview, modelview, [0.14, 0.14, 0.14]);
            currentColor = [0.05, 0.35, 0.15]; 
            gl.uniform3f(u_material.specularColor, 0.6, 0.8, 0.6); 
            gl.uniform1f(u_material.specularExponent, 64);
            teapot.render();
        popMatrix();
    }

}


function pushMatrix() {
    matrixStack.push( mat4.clone(modelview) );
}

function popMatrix() {
    modelview = matrixStack.pop();
}

function createModel(modelData) {
    var model = {};
    model.coordsBuffer = gl.createBuffer();
    model.normalBuffer = gl.createBuffer();
    model.indexBuffer = gl.createBuffer();
    model.count = modelData.indices.length;
    gl.bindBuffer(gl.ARRAY_BUFFER, model.coordsBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, modelData.vertexPositions, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, model.normalBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, modelData.vertexNormals, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, model.indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, modelData.indices, gl.STATIC_DRAW);
    model.render = function() {
        gl.bindBuffer(gl.ARRAY_BUFFER, this.coordsBuffer);
        gl.vertexAttribPointer(a_coords_loc, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.normalBuffer);
        gl.vertexAttribPointer(a_normal_loc, 3, gl.FLOAT, false, 0, 0);
        gl.uniform3fv(u_material.diffuseColor, currentColor);
        gl.uniformMatrix4fv(u_modelview, false, modelview );
        mat3.normalFromMat4(normalMatrix, modelview);
        gl.uniformMatrix3fv(u_normalMatrix, false, normalMatrix);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
        gl.drawElements(gl.TRIANGLES, this.count, gl.UNSIGNED_SHORT, 0);
    }
    return model;
}

function createProgram(gl, vertexShaderID, fragmentShaderID, attribute0) {
    function getTextContent( elementID ) {
        var element = document.getElementById(elementID);
        var node = element.firstChild;
        var str = "";
        while (node) {
            if (node.nodeType == 3)
                str += node.textContent;
            node = node.nextSibling;
        }
        return str;
    }
    try {
        var vertexShaderSource = getTextContent( vertexShaderID );
        var fragmentShaderSource = getTextContent( fragmentShaderID );
    }
    catch (e) {
        throw "Error: Could not get shader source code from script elements.";
    }
    var vsh = gl.createShader( gl.VERTEX_SHADER );
    gl.shaderSource(vsh,vertexShaderSource);
    gl.compileShader(vsh);
    if ( ! gl.getShaderParameter(vsh, gl.COMPILE_STATUS) ) {
        throw "Error in vertex shader:  " + gl.getShaderInfoLog(vsh);
     }
    var fsh = gl.createShader( gl.FRAGMENT_SHADER );
    gl.shaderSource(fsh, fragmentShaderSource);
    gl.compileShader(fsh);
    if ( ! gl.getShaderParameter(fsh, gl.COMPILE_STATUS) ) {
       throw "Error in fragment shader:  " + gl.getShaderInfoLog(fsh);
    }
    var prog = gl.createProgram();
    gl.attachShader(prog,vsh);
    gl.attachShader(prog, fsh);
    if (attribute0) {
       gl.bindAttribLocation(prog,0,attribute0);
    }
    gl.linkProgram(prog);
    if ( ! gl.getProgramParameter( prog, gl.LINK_STATUS) ) {
       throw "Link error in program:  " + gl.getProgramInfoLog(prog);
    }
    return prog;
}

function initGL() {
    var prog = createProgram(gl,"vshader-source","fshader-source", "a_coords");
    gl.useProgram(prog);
    gl.enable(gl.DEPTH_TEST);

    a_coords_loc =  gl.getAttribLocation(prog, "a_coords");
    a_normal_loc =  gl.getAttribLocation(prog, "a_normal");
    gl.enableVertexAttribArray(a_coords_loc);
    gl.enableVertexAttribArray(a_normal_loc);

    u_modelview = gl.getUniformLocation(prog, "modelview");
    u_projection = gl.getUniformLocation(prog, "projection");
    u_normalMatrix =  gl.getUniformLocation(prog, "normalMatrix");
    u_material = {
        diffuseColor: gl.getUniformLocation(prog, "material.diffuseColor"),
        specularColor: gl.getUniformLocation(prog, "material.specularColor"),
        specularExponent: gl.getUniformLocation(prog, "material.specularExponent")
    };
    u_lights = new Array(4);
    for (var i = 0; i < 4; i++) {
        u_lights[i] = {
            enabled: gl.getUniformLocation(prog, "lights[" + i + "].enabled"),
            position: gl.getUniformLocation(prog, "lights[" + i + "].position"),
            color: gl.getUniformLocation(prog, "lights[" + i + "].color")
        };
    }
    gl.uniform1i( u_lights[0].enabled, 1 );
    gl.uniform4f( u_lights[0].position, 2, 8, 5, 1 ); 
    gl.uniform3f( u_lights[0].color, 0.9, 0.9, 0.85 );

    gl.uniform1i( u_lights[1].enabled, 1 );
    gl.uniform4f( u_lights[1].position, -5, 3, 2, 1 ); 
    gl.uniform3f( u_lights[1].color, 0.3, 0.3, 0.4 );

    gl.uniform1i( u_lights[2].enabled, 1 );
    gl.uniform4f( u_lights[2].position, 0, 15, -5, 1 );
    gl.uniform3f( u_lights[2].color, 0.8, 0.8, 0.9 );

    gl.uniform1i( u_lights[3].enabled, 0 );

}

function mouseDown(evt) {
   var prevX, prevY;
   prevX = evt.clientX;
   prevY = evt.clientY;
   canvas.addEventListener("mousemove",mouseMove);
   document.addEventListener("mouseup",mouseUp);
   function mouseMove(evt) {
      var dx = evt.clientX - prevX;
      var dy = evt.clientY - prevY;
      rotateX += dy/200;
      rotateY += dx/200;
      prevX = evt.clientX;
      prevY = evt.clientY;
      draw();
   }
   function mouseUp(evt) {
      canvas.removeEventListener("mousemove",mouseMove);
      document.removeEventListener("mouseup",mouseUp);
   }
}
var animating = false;

function frame() {
    if (animating) {
        frameNumber += 1;
        draw();
        requestAnimationFrame(frame);
    }
}

function setIsAnimating() {
    var run = document.getElementById("animCheck").checked;
    if (run != animating) {
        animating = run;
        if (animating)
            requestAnimationFrame(frame);
    }
}


function init() {
    try {
        canvas = document.getElementById("webglcanvas");
        gl = canvas.getContext("webgl");
        if (!gl) {
            throw "Browser does not support WebGL";
        }
    }
    catch (e) {
        document.getElementById("message").innerHTML =
            "<p>Sorry, could not get a WebGL graphics context.</p>";
        return;
    }
    try {
        initGL();
    }
    catch (e) {
        document.getElementById("message").innerHTML =
            "<p>Sorry, could not initialize the WebGL graphics context:" + e + "</p>";
        return;
    }
    document.getElementById("animCheck").checked = false;
    document.getElementById("animCheck").addEventListener("change", setIsAnimating);
    document.getElementById("reset").addEventListener("click", function () { rotateX = rotateY = 0; draw(); });
    canvas.addEventListener("mousedown", mouseDown);
    try {
        cone = createModel(uvConeIFS());
        cylinder = createModel(uvCylinderIFS());
        cube = createModel(cubeIFS());
        if (typeof uvSphereIFS !== 'undefined') { sphere = createModel(uvSphereIFS()); }
    } catch (err) {
        try {
            cone = createModel(uvCone());
            cylinder = createModel(uvCylinder());
            cube = createModel(cube());
            if (typeof uvSphere !== 'undefined') { sphere = createModel(uvSphere()); }
        } catch (err2) {
            if (typeof basicObjects !== 'undefined') {
                cone = createModel(basicObjects.cone);
                cylinder = createModel(basicObjects.cylinder);
                cube = createModel(basicObjects.cube);
                if (basicObjects.sphere) { sphere = createModel(basicObjects.sphere); }
            }
        }
    }

    try {
        if (typeof TeapotModel !== 'undefined') {
            teapot = createModel(TeapotModel);
        } else if (typeof teapotModel !== 'undefined') {
            teapot = createModel(teapotModel);
        }
    } catch (e) {
        console.error("Błąd ładowania czajnika:", e);
    }

    draw();
}

    </script>
</head>
<body onload="init()">

    <h2>DiskWorld 2: WebGL Photorealistic Studio Lighting</h2>

    <noscript><hr><h3>This page requires Javascript and a web browser that supports WebGL</h3><hr></noscript>

    <p id="message" style="font-weight:bold">Drag your mouse on the model to rotate it.</p>

    <p>
        <label><input type="checkbox" id="animCheck">Animate</label>
        <button id="reset" style="margin-left:40px">Reset</button>
    </p>

    <div>
        <canvas width=800 height=800 id="webglcanvas"></canvas>
    </div>
</body>
</html>
