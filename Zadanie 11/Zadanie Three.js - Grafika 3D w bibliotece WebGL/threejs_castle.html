<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Three.js + GLSL — mury i wieża</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2030);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(15, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);


const vertexShader = `
  varying vec3 vNormal;
  varying vec3 vPos;

  void main() {
    vNormal = normalize(normalMatrix * normal);
    vPos = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  varying vec3 vNormal;
  varying vec3 vPos;

  uniform vec3 uColor;
  uniform float uTime;

  void main() {
    vec3 lightDir = normalize(vec3(0.6, 1.0, 0.4));
    float diff = max(dot(vNormal, lightDir), 0.0);
    float amb = 0.25;

    float stripe = step(0.5, fract(vPos.y * 1.5));
    vec3 base = mix(uColor, uColor * 0.7, stripe);

    gl_FragColor = vec4(base * (diff + amb), 1.0);
  }
`;

function makeMaterial(color) {
  return new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uTime: { value: 0 }
    }
  });
}


const groundGeo = new THREE.PlaneGeometry(40, 40);
const ground = new THREE.Mesh(groundGeo, makeMaterial(0x3a5a3a));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);


const wallMat = makeMaterial(0x8a8378);

const wallLength = 16;
const wallHeight = 4;
const wallThickness = 0.6;

const wallN = new THREE.Mesh(new THREE.BoxGeometry(wallLength, wallHeight, wallThickness), wallMat);
wallN.position.set(0, wallHeight / 2, -wallLength / 2);
scene.add(wallN);

const wallS = new THREE.Mesh(new THREE.BoxGeometry(wallLength, wallHeight, wallThickness), wallMat);
wallS.position.set(0, wallHeight / 2, wallLength / 2);
scene.add(wallS);

const wallE = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, wallLength), wallMat);
wallE.position.set(wallLength / 2, wallHeight / 2, 0);
scene.add(wallE);

const wallW = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, wallLength), wallMat);
wallW.position.set(-wallLength / 2, wallHeight / 2, 0);
scene.add(wallW);


const battlementMat = makeMaterial(0x9a9388);
const battlementSize = 0.5;
const battlementSpacing = 1.2;

for (let i = -wallLength / 2 + 0.6; i <= wallLength / 2 - 0.6; i += battlementSpacing) {
  const bN = new THREE.Mesh(new THREE.BoxGeometry(battlementSize, battlementSize, wallThickness), battlementMat);
  bN.position.set(i, wallHeight + battlementSize / 2, -wallLength / 2);
  scene.add(bN);

  const bS = new THREE.Mesh(new THREE.BoxGeometry(battlementSize, battlementSize, wallThickness), battlementMat);
  bS.position.set(i, wallHeight + battlementSize / 2, wallLength / 2);
  scene.add(bS);

  const bE = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, battlementSize, battlementSize), battlementMat);
  bE.position.set(wallLength / 2, wallHeight + battlementSize / 2, i);
  scene.add(bE);

  const bW = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, battlementSize, battlementSize), battlementMat);
  bW.position.set(-wallLength / 2, wallHeight + battlementSize / 2, i);
  scene.add(bW);
}


const towerMat = makeMaterial(0x7a6f5e);
const towerHeight = 8;
const towerRadius = 1.5;

const towerBody = new THREE.Mesh(
  new THREE.CylinderGeometry(towerRadius, towerRadius * 1.1, towerHeight, 24),
  towerMat
);
towerBody.position.set(0, towerHeight / 2, 0);
scene.add(towerBody);

const towerTop = new THREE.Mesh(
  new THREE.CylinderGeometry(towerRadius * 1.2, towerRadius * 1.2, 0.4, 24),
  battlementMat
);
towerTop.position.set(0, towerHeight + 0.2, 0);
scene.add(towerTop);

const roofMat = makeMaterial(0x6a3a2a);
const roof = new THREE.Mesh(
  new THREE.ConeGeometry(towerRadius * 1.3, 2.5, 24),
  roofMat
);
roof.position.set(0, towerHeight + 0.4 + 1.25, 0);
scene.add(roof);


const cornerTowerHeight = 5;
const cornerTowerRadius = 0.9;
const cornerOffset = wallLength / 2;

for (const [cx, cz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const ct = new THREE.Mesh(
    new THREE.CylinderGeometry(cornerTowerRadius, cornerTowerRadius, cornerTowerHeight, 16),
    towerMat
  );
  ct.position.set(cx * cornerOffset, cornerTowerHeight / 2, cz * cornerOffset);
  scene.add(ct);

  const ctRoof = new THREE.Mesh(
    new THREE.ConeGeometry(cornerTowerRadius * 1.1, 1.4, 16),
    roofMat
  );
  ctRoof.position.set(cx * cornerOffset, cornerTowerHeight + 0.7, cz * cornerOffset);
  scene.add(ctRoof);
}


window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  scene.traverse(obj => {
    if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
      obj.material.uniforms.uTime.value = t;
    }
  });
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
