<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raymarching Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div style="position:absolute;top:10px;left:10px;z-index:10;">
        <button id="unionBtn">Suma</button>
        <button id="interBtn">Przecięcie</button>
        <button id="diffBtn">Różnica</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
          }
        }
    </script>

    <script type="module">
        // @ts-ignore
        import * as THREE from 'three';

        const scene = new THREE.Scene();

        // POPRAWKA 3: Zmiana zakresu Z kamery z (0, 1) na (-1, 1), żeby na pewno nie ucięło płaszczyzny
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Dobra praktyka dla ekranów Retina
        document.body.appendChild(renderer.domElement);

        const vertexShader = `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
        `;

        const fragmentShader = `
        uniform vec2 u_resolution;
        uniform float u_time;
        uniform int u_operation;

        float sdCircle(vec2 p, float r){
            return length(p) - r;
        }

        float sdBox(vec2 p, vec2 b){
            vec2 d = abs(p) - b;
            return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
        }

        mat2 rot(float a){
            float s = sin(a);
            float c = cos(a);
            return mat2(c, -s, s, c);
        }

        void main(){
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

            // ===== KOŁO =====
            vec2 circlePos = vec2(
                0.4 * cos(u_time),
                0.3 * sin(1.7 * u_time)
            );
            float circle = sdCircle(uv - circlePos, 0.25);

            // ===== PROSTOKĄT =====
            vec2 pBox = uv;
            pBox *= rot(u_time);
            float scale = 0.25 + 0.08 * sin(2.0 * u_time);
            float box = sdBox(pBox, vec2(scale, 0.15));

            // ===== OPERACJE CSG =====
            float sdf;
            if(u_operation == 0) {
                sdf = min(circle, box);
            } else if(u_operation == 1) {
                sdf = max(circle, box);
            } else {
                sdf = max(circle, -box);
            }

            vec3 bgColor = vec3(0.05, 0.05, 0.1);
            vec3 shapeColor = vec3(0.2, 0.8, 1.0);

            vec3 col = (sdf < 0.0) ? shapeColor : bgColor;
            gl_FragColor = vec4(col, 1.0);
        }
        `;

        const geometry = new THREE.PlaneGeometry(2, 2);

        // POPRAWKA 2: Bezpieczne pobranie wymiarów okna na start
        const width = window.innerWidth > 0 ? window.innerWidth : 800;
        const height = window.innerHeight > 0 ? window.innerHeight : 600;

        const material = new THREE.ShaderMaterial({
          vertexShader,
          fragmentShader,
          depthWrite: false,  // Wyłączamy bufor głębi, bo rysujemy tylko płaszczyznę 2D full-screen
          depthTest: false,
          uniforms: {
            u_resolution: { value: new THREE.Vector2(width, height) },
            u_time: { value: 0.0 },
            u_operation: { value: 0 }
          }
        });

        // Teraz te elementy istnieją i przypisanie eventów zadziała prawidłowo
        document.getElementById("unionBtn")!.onclick = () => {
          material.uniforms.u_operation.value = 0;
        };
        document.getElementById("interBtn")!.onclick = () => {
          material.uniforms.u_operation.value = 1;
        };
        document.getElementById("diffBtn")!.onclick = () => {
          material.uniforms.u_operation.value = 2;
        };

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', () => {
          renderer.setSize(window.innerWidth, window.innerHeight);
          material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);
          material.uniforms.u_time.value = clock.getElapsedTime();
          renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
